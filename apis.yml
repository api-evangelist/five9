aid: five9
name: Five9
description: >-
  Five9 is a leading cloud contact center (CCaaS) platform providing inbound,
  outbound, blended, and omnichannel customer engagement with intelligent
  virtual agents, workforce optimization, agent assist, and analytics. Five9
  exposes multiple developer APIs including REST APIs for configuration and
  reporting, SOAP-based Configuration and Statistics Web Services, the Agent
  and Supervisor REST APIs (app.five9.com/appsvcs), and Voicestream/event
  APIs, with authentication via session login and API user credentials.
