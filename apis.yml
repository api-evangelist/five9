apis:
  - aid: five9:agent-supervisor-rest-api
    name: Five9 Agent and Supervisor REST API
    description: >-
      REST API used by agent and supervisor applications to log in, manage
      state, handle interactions, and access supervisor monitoring features
      on the Five9 cloud contact center platform. Authenticated via session
      login at /appsvcs/rs/svc/auth/login with API-enabled user credentials.
    humanURL: https://www.five9.com/development
